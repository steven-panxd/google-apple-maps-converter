<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Demo link</title>
  <style>
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f2f2f7; font: 400 19px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; color: #111; }
    .card { width: min(88vw, 360px); background: #fff; border-radius: 22px; padding: 22px 22px 24px; }
    .from { font-size: 15px; color: #6b6b70; margin: 0 0 8px; }
    p { margin: 0; }
    a { display: block; margin-top: 10px; color: #0a66ff; word-break: break-all; font-size: 17px; }
  </style>
</head>
<body>
  <div class="card">
    <p class="from">Alex</p>
    <p>Let's meet here 👇</p>
    <a href="https://www.google.com/maps/place/Eiffel+Tower/@48.8583701,2.2919064,17z/data=!3m1!4b1!4m2!3d48.8583701!4d2.2944813">https://www.google.com/maps/place/Eiffel+Tower</a>
  </div>
</body>
</html>
